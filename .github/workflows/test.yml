name: TestUnit
on:
  pull_request:
    paths:
      - '**/*.go'
      - '**/*.mod'
jobs:
  test-unit:
    name: Test Units
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v3
      - name: Setup go
        uses: actions/setup-go@v3
        with:
          go-version: '1.23.2' # Minimum version required by Cosmos SDK v0.53.8.
      - run: make test
